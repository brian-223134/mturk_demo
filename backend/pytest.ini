# backend 테스트 설정. 컨테이너에서는 `docker compose run --rm backend-test` 가 /app/backend 에서 pytest 를 돌리고,
# 호스트에서는 backend/ 로 들어가 pytest 를 돌린다. pythonpath 로 app(backend/)과 agent(저장소 루트)를 import 하게 한다.
# 컨테이너의 backend/ 는 읽기 전용 bind mount 라 .pytest_cache 를 만들지 않는다.
[pytest]
testpaths = tests
pythonpath = . ..
addopts = -p no:cacheprovider
