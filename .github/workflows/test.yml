# 저장소의 테스트 네 묶음(backend, agent, frontend, prototype)을 job 하나씩 나란히 돌린다.
# main 으로의 push(merge 포함), main 을 향한 pull request, 그리고 Actions 화면의 Run workflow 버튼으로 돈다.
# checkout 에는 gitignore 된 폴더(external/, assets/, output/, var/, feedback/)가 없으므로 테스트는 커밋된 파일만 읽는다.
# OpenRouter 는 부르지 않는다 (AGENT_ALLOW_API=0 고정). 필요한 secret 은 없다.
name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# pull request 에 새 push 가 오면 아직 돌고 있는 이전 실행을 취소한다. main 의 push 는 커밋마다 끝까지 돈다
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # FastAPI 백엔드 (backend/tests). pytest.ini 의 pythonpath 로 저장소 루트의 agent 도 import 하고,
  # 대조용으로 data/, environment/models/, prototype 의 routes.ts 와 domain 테스트를 읽는다.
  # DB 는 service container 의 PostgreSQL 이다 (docker-compose.yml 의 db-test 와 같은 이미지와 계정). 테스트마다 schema 를 새로 만든다
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: mturk_test
          POSTGRES_USER: mturk
          POSTGRES_PASSWORD: mturk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mturk -d mturk_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      AGENT_ALLOW_API: "0"
      TEST_DATABASE_URL: postgresql://mturk:mturk@localhost:5432/mturk_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run pytest
        run: pytest -q

  # agent 파이프라인 (agent/tests, unittest). 저장소 루트에서 python -m agent test 로 돈다.
  # AGENT_LOCAL_SAMPLE_DIR 이 없으므로 로컬 원본 데이터 테스트는 건너뛴다
  agent:
    name: agent (unittest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AGENT_ALLOW_API: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r agent/requirements.txt
      - name: Run unittest
        run: python -m agent test

  # vanilla JS 화면 (frontend/tests, node:test). npm 의존성이 없어 설치 단계가 없다.
  # prototype 의 routes.ts, example/, data/templates 를 상대 경로로 읽는다
  frontend:
    name: frontend (node:test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      # glob 은 따옴표로 감싸 node 가 펼치게 한다 (bash 는 globstar 가 꺼져 있어 ** 를 * 처럼 펼친다)
      - name: Run node:test
        run: node --test 'tests/**/*.test.js'

  # React 프로토타입과 mock API 서버 (prototype/src, prototype/server, Vitest). data/ 와 example/ 을 읽는다
  prototype:
    name: prototype (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run vitest
        run: npm test
