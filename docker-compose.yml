# MTurk Console (mock)
#
# 프로토타입 콘솔(React)과 mock API 서버는 prototype/ 아래에 있다 (Dockerfile도 prototype/Dockerfile). 빌드 컨텍스트는
# data/와 example/을 함께 복사하기 위해 저장소 루트로 두고, 이미지 안에서도 같은 배치(/app/prototype, /app/data)를 유지한다.
#
#   docker compose up --build              web + api   → http://localhost:8080   (시연용. 데이터는 SQLite에 남는다)
#   docker compose --profile dev up dev    dev + api   → http://localhost:5173   (Vite HMR)
#   docker compose --profile mock up web-mock          → http://localhost:8081   (서버 없이 브라우저만으로. 비상용)
#   docker compose run --rm test                         Vitest 단위 테스트
#   docker compose run --rm agent run var/<task>/raw.json --prompt @var/<task>/prompt.md --spec var/<task>/task_spec.json --out output/<task>
#                                                        원본 + prompt → hits.csv + template.html (agent/README.md). 입력은 var/ 아래,
#                                                        출력은 output/<task>/ 아래 (--out 을 빼면 output/<원본 파일 이름>/)
#   docker compose run --rm agent test                   agent 단위 테스트 (unittest)
#   docker compose exec api npm run sql -- "SELECT status, COUNT(*) FROM assignments GROUP BY 1"
#
#   브라우저 ──▶ web (nginx: 정적 파일, /api 프록시) ──▶ api (Node: REST + 메모리 상태) ──▶ SQLite (volume "db")
#                                                          ▲ 처음 한 번, 그리고 Reset to fixtures 때
#                                                        ./data (JSON + HTML)
#
# Production 뼈대 (frontend/, backend/):
#   docker compose up --build              frontend + backend → http://localhost:3000   (vanilla JS 화면, FastAPI)
#   브라우저 ──▶ frontend (nginx: frontend/src 정적 파일, /api 프록시) ──▶ backend (FastAPI: 콘솔 REST + agent job API)
#                                                                          ├─▶ SQLite (volume "backend-db"), 처음 한 번 ./data 로 채움
#                                                                          └─▶ agent/ (import) → ./output/jobs/<job id>/
#   API_UPSTREAM=http://api:8787 docker compose up --no-deps frontend api    frontend 를 prototype 의 mock API 에 붙여 본다
#   docker compose run --rm backend-test                backend 테스트 (pytest, 테스트 이미지 안에만 설치)
#   docker compose run --rm frontend-test               frontend 테스트 (node:test, npm 의존성 없음)
#
# 처음 상태로 완전히 돌리려면: 화면의 Mock tools → Reset to fixtures, 또는 `docker compose down -v` (DB volume 삭제).

name: mturk-console

services:
  api:
    build:
      context: .
      dockerfile: prototype/Dockerfile
      target: api
    image: mturk-console:api
    environment:
      # 응답을 일부러 늦춰 로딩 상태가 보이게 한다 (명세 7.2). "0-0"이면 지연이 없다.
      MOCK_DELAY_MS: ${MOCK_DELAY_MS:-100-300}
    volumes:
      # 시작 데이터. JSON이나 템플릿 HTML을 고친 뒤 Reset to fixtures를 누르면 다시 읽는다 (이미지를 다시 빌드할 필요가 없다).
      - ./data:/app/data:ro
      # SQLite 파일. bind mount가 아니라 volume에 둔다: WAL 모드의 공유 메모리 파일이 Docker Desktop의 파일 공유 위에서는 안전하지 않다.
      - db:/app/var
    ports:
      # REST를 curl로 직접 불러 볼 수 있게 연다. 기본은 이 PC에서만 접속된다.
      - "${BIND_ADDR:-127.0.0.1}:${API_PORT:-8787}:8787"

  web:
    build:
      context: .
      dockerfile: prototype/Dockerfile
      target: web
      args:
        VITE_API_MODE: http
    image: mturk-console:web
    depends_on:
      api:
        condition: service_healthy
    ports:
      # 같은 네트워크의 다른 PC에서 보려면 BIND_ADDR=0.0.0.0 으로 띄운다.
      - "${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-8080}:80"

  # 서버와 DB 없이 브라우저 안에서 전부 동작하는 빌드 (data/가 번들에 들어가고, 변경은 그 브라우저의 IndexedDB에 남는다).
  # api에 문제가 생겼을 때의 대비용이다.
  web-mock:
    profiles: [mock]
    build:
      context: .
      dockerfile: prototype/Dockerfile
      target: web
      args:
        VITE_API_MODE: mock
    image: mturk-console:web-mock
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${WEB_MOCK_PORT:-8081}:80"

  dev:
    profiles: [dev]
    build:
      context: .
      dockerfile: prototype/Dockerfile
      target: dev
    image: mturk-console:dev
    depends_on:
      api:
        condition: service_healthy
    environment:
      VITE_API_MODE: http
      API_PROXY_TARGET: http://api:8787
      # 소스를 고쳐도 화면이 안 바뀌면(파일 이벤트가 컨테이너로 안 넘어오는 환경) true로 띄운다
      VITE_WATCH_POLLING: ${VITE_WATCH_POLLING:-false}
    ports:
      # HMR 웹소켓이 같은 포트로 붙으므로 호스트 포트도 5173으로 고정한다
      - "${BIND_ADDR:-127.0.0.1}:5173:5173"
    volumes:
      # 소스만 mount한다. 프로젝트 전체를 mount하면 macOS에서 설치한 node_modules가 컨테이너의
      # Linux용 node_modules를 덮어써서 rolldown 같은 네이티브 바이너리가 깨진다.
      - ./prototype/src:/app/prototype/src
      - ./example:/app/example
      - ./prototype/index.html:/app/prototype/index.html
      - ./prototype/vite.config.ts:/app/prototype/vite.config.ts:ro

  test:
    profiles: [test]
    build:
      context: .
      dockerfile: prototype/Dockerfile
      target: test
    image: mturk-console:test
    volumes:
      # 이미지를 다시 빌드하지 않아도 지금 작업 중인 코드와 데이터로 테스트한다
      - ./prototype/src:/app/prototype/src:ro
      - ./prototype/server:/app/prototype/server:ro
      - ./data:/app/data:ro
      - ./example:/app/example:ro

  # 원본 데이터와 prompt로 HIT 단위 CSV와 MTurk 템플릿을 만드는 Python 파이프라인 (agent/README.md).
  # 코드는 bind mount로 쓰므로 고쳐도 이미지를 다시 빌드할 필요가 없다. 실험용 입력은 var/<task>/ 에, 출력은 output/<task>/ 에
  # 둔다 (둘 다 gitignore). --out 을 빼면 output/<원본 파일 이름>/ 이 기본 출력 폴더다.
  # assets/ 는 데이터 형식을 이해하기 위한 예시 자료일 뿐이므로 mount 하지 않는다.
  # OpenRouter 호출은 크레딧을 쓰므로 AGENT_ALLOW_API=1 을 붙여 실행할 때만 허용된다. 키와 모델 설정 이름(AGENT_MODEL)은
  # environment/.env 에서 읽고, 모델 설정 파일은 environment/models/ 에서 읽는다.
  agent:
    profiles: [agent]
    build:
      context: ./agent
    image: mturk-console:agent
    env_file:
      - path: ./environment/.env
        required: false
    environment:
      AGENT_ALLOW_API: ${AGENT_ALLOW_API:-0}
    working_dir: /work
    volumes:
      - ./agent:/work/agent:ro
      # 실험용 입력을 두는 곳, gitignore됨. 다른 폴더가 필요하면 `docker compose run -v <폴더>:/work/<이름> …`로 추가
      - ./var:/work/var
      # 실행 결과 기본 폴더 (--out 을 빼면 output/<원본 파일 이름>/), gitignore됨
      - ./output:/work/output
      # 모델 설정 yaml
      - ./environment/models:/work/environment/models:ro

  # ── Production 뼈대 ─────────────────────────────────────────────────────────
  # FastAPI 백엔드. 콘솔 REST(/api/…)는 prototype/src/api/http/routes.ts 의 경로 표를 그대로 구현하고,
  # agent 파이프라인은 /api/agent/jobs 로 노출한다 (agent/ 를 import). 의존성은 backend/requirements.txt 로 이미지 안에만 설치한다.
  # 코드는 bind mount 로 쓰므로 고쳐도 다시 빌드할 필요가 없다 (uvicorn --reload). OpenRouter 호출은 AGENT_ALLOW_API=1 일 때만.
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: mturk-console:backend
    env_file:
      - path: ./environment/.env
        required: false
    environment:
      AGENT_ALLOW_API: ${AGENT_ALLOW_API:-0}
      DATA_DIR: /app/data
      DB_PATH: /app/var/backend.sqlite
      OUTPUT_DIR: /app/output
      MODELS_DIR: /app/environment/models
      ENV_FILE: /app/environment/.env
    volumes:
      - ./backend/app:/app/backend/app:ro
      - ./agent:/app/agent:ro
      - ./data:/app/data:ro
      - ./environment/models:/app/environment/models:ro
      - ./environment/.env:/app/environment/.env:ro
      # agent job 의 입력과 결과 (output/jobs/<job id>/), gitignore 됨
      - ./output:/app/output
      # SQLite. prototype 의 db volume 과 별개다
      - backend-db:/app/var
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"

  # backend 의 pytest 테스트 (backend/tests). 실행 이미지 위에 backend/requirements-dev.txt(pytest, httpx2)만 더 설치한
  # backend/Dockerfile 의 test stage 로 만든다. 코드(backend/, agent/)와 data/, 모델 설정, 그리고 대조용으로 읽는 prototype 의
  # 경로 표(routes.ts)와 domain 테스트는 읽기 전용 bind mount 라 고쳐도 다시 빌드할 필요가 없다 (requirements*.txt 를 바꿨을 때만).
  # SQLite 와 job 출력은 pytest 의 임시 폴더(/tmp, tmpfs)에 만들고, OpenRouter 는 부르지 않는다 (AGENT_ALLOW_API=0 고정).
  #   docker compose build backend-test
  #   docker compose run --rm backend-test                          전체
  #   docker compose run --rm backend-test pytest -q tests/test_console_api.py   일부만
  backend-test:
    profiles: [test]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    image: mturk-console:backend-test
    environment:
      AGENT_ALLOW_API: "0"
    volumes:
      - ./backend:/app/backend:ro
      - ./agent:/app/agent:ro
      - ./data:/app/data:ro
      - ./environment/models:/app/environment/models:ro
      - ./prototype/src/api/http/routes.ts:/app/prototype/src/api/http/routes.ts:ro
      - ./prototype/src/domain:/app/prototype/src/domain:ro
    tmpfs:
      # pytest 의 tmp_path (DB, job 출력, data/ 의 깨진 사본)
      - /tmp

  # vanilla JS 화면. 빌드 단계가 없어 frontend/src 를 그대로 서빙하고, /api 는 backend 로 넘긴다.
  # 개발 중에는 bind mount 로 파일을 고치면 새로고침만으로 반영된다. API_UPSTREAM 을 바꾸면 prototype 의 mock API 에도 붙는다.
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: mturk-console:frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://backend:8000}
    volumes:
      - ./frontend/src:/usr/share/nginx/html:ro
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${FRONTEND_PORT:-3000}:80"

  # frontend 단위 테스트. Node 의 내장 test runner(node --test)와 node:assert 만 쓰므로 이미지를 빌드하지 않고 node:24-slim 을 그대로 쓴다.
  # routes.test.js 가 prototype 의 경로 표(routes.ts)와 대조하므로 그 파일 하나만 같은 위치에 읽기 전용으로 mount 한다.
  #   docker compose run --rm frontend-test
  frontend-test:
    profiles: [test]
    image: node:24-slim
    working_dir: /app/frontend
    command: ["node", "--test", "tests/**/*.test.js"]
    volumes:
      - ./frontend:/app/frontend:ro
      - ./prototype/src/api/http/routes.ts:/app/prototype/src/api/http/routes.ts:ro

volumes:
  db:
  backend-db:
