server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # REST 요청은 api 서비스(mock API 서버)로 넘긴다. 브라우저는 같은 origin만 부르므로 CORS 설정이 필요 없다.
    # 주소를 변수에 담아 요청이 올 때 찾게 한다. 그러지 않으면 nginx가 시작할 때 "api"를 찾지 못해
    # api 없이 띄우는 web-mock이 아예 뜨지 않는다. 127.0.0.11은 Docker 내장 DNS다.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8787;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        # 게시할 때 CSV 전체가 body로 온다. 셀 하나가 100KB를 넘을 수 있다 (명세 9장).
        client_max_body_size 256m;
    }

    # 파일명에 해시가 붙는 빌드 산출물은 내용이 바뀌면 이름도 바뀌므로 오래 캐시한다
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 예시 파일은 같은 이름으로 바뀔 수 있으므로 매번 서버에 확인한다. 없는 파일은 index.html로 넘기지 않고 404로 답한다.
    location /samples/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA 라우팅: /manage/batch-1000001/review 같은 경로에서 새로고침해도 앱이 뜬다
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
