# DeepSeek V4.1 Flash 설정이다. 콘솔의 HIT data 화면에서 LLM 이 binding 을 쓸 때 기본으로 쓴다. 키나 비밀은 여기에 적지 않는다 (키는 environment/.env 에만 둔다).
# 고르는 법: binding 은 .env 의 AGENT_BINDING_MODEL=<이름> 으로 바꾼다. spec 을 쓰는 planner 에 쓰려면 AGENT_MODEL=deepseek-v4.1-flash 를 적거나 명령에 --model-config deepseek-v4.1-flash 를 준다.
#
# 모델: deepseek/deepseek-v4.1-flash-1017 (2026-11 기준, OpenRouter 공개 모델 목록에서 확인한 값)
#   - 2026-10-17 의 snapshot 이다. 이름에 날짜가 있어 나중에 내용이 바뀌지 않으므로 결과를 비교하기 좋다. context 1M.
#   - 업체: crusoe/fp8 를 먼저 쓰고, 안 되면 parasail/fp8 로 넘어간다. 값: 입력 $0.29, $0.30 / 출력 둘 다 $1.20 (백만 토큰당). 같은 모델의 다른 fp8 업체 가운데 싼 쪽은 deepinfra/fp8($0.098 / $0.294)이다.
#   - response_format(JSON 출력 강제), structured_outputs, reasoning(effort 조절), seed 를 지원한다.
#   - 두 업체가 모두 안 되면 호출이 실패한다. 어느 업체가 답했는지는 콘솔의 답 아래에 나온다.

api: openrouter                 # 호출하는 API. 지금은 openrouter 만 지원한다
model: deepseek/deepseek-v4.1-flash-1017   # OpenRouter 의 모델 id
# provider 는 OpenRouter 의 라우팅 설정이다. order 의 업체를 차례로 시도한다. allow_fallbacks: false 면 목록 밖으로 나가지 않고, true 면 목록이 모두 실패했을 때 다른 업체로도 넘어간다.
# 태그는 python3 -m agent providers <모델 id> 로 본다 (키·크레딧 불필요). 태그를 적으면 그 업체로만 보낸다. 예:
# provider: crusoe/fp8
# provider: {order: [crusoe, deepinfra], allow_fallbacks: true, quantizations: [fp8]}
provider: {order: [crusoe, parasail], allow_fallbacks: false, quantizations: [fp8]}
params:                         # chat completions 요청 본문에 그대로 들어가는 파라미터 (model, messages, provider 는 못 쓴다)
  temperature: 0
  seed: 7                       # 같은 요청의 결과를 되도록 같게 한다
  max_tokens: 12000             # 출력 상한. reasoning 토큰도 출력 토큰으로 세므로 넉넉히 잡는다 (8000 에서 과제 Agent 가 추론만 하다 잘린 일이 있다, 11-14)
  response_format:
    type: json_object           # 답을 JSON 객체 하나로 강제한다
  usage:
    include: true               # OpenRouter가 응답 usage에 실제 청구액 cost를 넣어 준다
  reasoning:
    effort: low                 # 추론량 (low / medium / high). 높일수록 느려지고 출력 토큰이 늘어난다
timeout_seconds: 180            # 요청 하나를 기다리는 최대 시간(초)
planner:
  spec_fix_retries: 2           # 검증 실패 시 오류를 붙여 다시 묻는 횟수
  profile_max_chars: 24000      # 프롬프트에 넣는 profile의 최대 글자 수
