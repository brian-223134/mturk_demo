# agent의 기본 모델 설정이다. 키나 비밀은 여기에 적지 않는다 (키는 environment/.env 에만 둔다).
# 다른 모델을 쓰려면 이 파일을 복사해 <이름>.yaml 로 저장하고 .env 의 AGENT_MODEL=<이름> 또는
# --model-config <이름> 으로 고른다. 파일 형식은 agent/config.py 가 검사한다.

provider: openrouter            # 지금은 openrouter만 지원한다
model: openai/gpt-4o-mini       # provider의 모델 id
params:                         # chat completions 요청 본문에 그대로 들어가는 파라미터
  temperature: 0
  max_tokens: 8000
  response_format:
    type: json_object
timeout_seconds: 120            # 요청 하나를 기다리는 최대 시간(초)
planner:
  spec_fix_retries: 1           # 검증 실패 시 오류를 붙여 다시 묻는 횟수
  profile_max_chars: 12000      # 프롬프트에 넣는 profile의 최대 글자 수
